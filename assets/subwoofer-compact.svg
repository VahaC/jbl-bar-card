<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 310" role="img" aria-label="Wireless subwoofer lying on its side">
  <defs>
    <radialGradient id="jsc-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jsc-body-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.25" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="0.7" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="jsc-face" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#3a3a3e"/>
      <stop offset="0.7" stop-color="#26262a"/>
      <stop offset="1" stop-color="#18181b"/>
    </radialGradient>
    <pattern id="jsc-grille" width="3.4" height="3.4" patternUnits="userSpaceOnUse">
      <circle cx="1.7" cy="1.7" r="0.75" fill="#000" fill-opacity="0.45"/>
    </pattern>
    <linearGradient id="jsc-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d8d92"/>
      <stop offset="0.5" stop-color="#3d3d41"/>
      <stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
  </defs>
  <ellipse cx="180" cy="290" rx="150" ry="12" fill="url(#jsc-shadow)"/>
