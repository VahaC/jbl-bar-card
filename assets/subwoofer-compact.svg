<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 310" role="img" aria-label="Wireless subwoofer lying on its side">
  <!-- Same palette and finish as bar-docked.svg / bar-center.svg so the set looks like one system. -->
  <defs>
    <radialGradient id="jsc-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jsc-body-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="0.75" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="jsc-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a7a7d"/>
      <stop offset="0.08" stop-color="#6a6a6d"/>
      <stop offset="0.55" stop-color="#5b5b5e"/>
      <stop offset="0.86" stop-color="#4e4e51"/>
      <stop offset="1" stop-color="#3f3f42"/>
    </linearGradient>
    <linearGradient id="jsc-grille" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58585b"/>
      <stop offset="1" stop-color="#4c4c4f"/>
    </linearGradient>
    <linearGradient id="jsc-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.11"/>
      <stop offset="0.8" stop-color="#fff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="jsc-holes" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.75" fill="#000" fill-opacity="0.28"/>
    </pattern>
  </defs>
  <ellipse cx="180" cy="290" rx="150" ry="12" fill="url(#jsc-shadow)"/>
